# Runs the release gate on every push to main: lint, units, data safety, a11y, i18n,
# service worker, analytics worker and the visual check, in Chromium and WebKit.
name: precheck
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run precheck
