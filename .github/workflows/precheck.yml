# Runs the release gate on every push to main: lint, units, data safety, a11y, i18n,
# service worker, analytics worker and the visual check, in Chromium and WebKit.
name: precheck
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run precheck
